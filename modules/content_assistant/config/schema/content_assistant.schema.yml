content_assistant.settings:
  type: config_object
  label: 'Content assistant settings'
  mapping:
    max_results:
      type: integer
      label: 'Maximum results per call'
    collections:
      type: sequence
      label: 'Collections'
      sequence:
        type: mapping
        label: 'Collection'
        mapping:
          id:
            type: string
            label: 'Machine name'
          label:
            type: label
            label: 'Label'
          description:
            type: text
            label: 'Description for the assistant'
          bundle:
            type: string
            label: 'Content type'
          date_field:
            type: string
            label: 'Date field'
          group_field:
            type: string
            label: 'Group field'
          search_fields:
            type: sequence
            label: 'Searchable text fields'
            sequence:
              type: string
              label: 'Field'
          allow_drafts:
            type: boolean
            label: 'Allow drafts'
          body_field:
            type: string
            label: 'Body field for drafts'
