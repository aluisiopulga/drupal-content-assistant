name: tests

on:
  push:
  pull_request:

jobs:
  phpunit:
    name: Drupal ${{ matrix.drupal }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - drupal: '10.5'
            php: '8.2'
            mcp: false
          - drupal: '10'
            php: '8.3'
            mcp: true
          - drupal: '11'
            php: '8.3'
            mcp: true
    env:
      SIMPLETEST_DB: 'sqlite://localhost/sites/simpletest/db.sqlite'
      SIMPLETEST_BASE_URL: 'http://localhost'
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, pdo_sqlite, sqlite3
          coverage: none
      - name: Create a Drupal ${{ matrix.drupal }} site
        run: |
          composer create-project drupal/recommended-project:^${{ matrix.drupal }} drupal --no-interaction --no-progress
          cd drupal
          composer require --dev drupal/core-dev:^${{ matrix.drupal }} --no-interaction --no-progress -W
          composer require 'drupal/tool:^1.0@beta' --no-interaction --no-progress
          if [ "${{ matrix.mcp }}" = "true" ]; then
            composer require 'drupal/mcp_server:^2.0@beta' 'drupal/mcp_server_tool_bridge:^1.0@beta' --no-interaction --no-progress
          fi
          mkdir -p web/modules/custom web/sites/simpletest
          cp -r ../repo/modules/* web/modules/custom/
      - name: Run PHPUnit (unit and kernel tests)
        working-directory: drupal/web
        run: ../vendor/bin/phpunit -c core modules/custom

  coding-standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Install drupal/coder
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require drupal/coder --no-interaction --no-progress
          composer global config bin-dir --absolute --quiet >> "$GITHUB_PATH"
      - name: Register the Drupal standards
        run: |
          VENDOR=$(composer global config vendor-dir --absolute --quiet)
          phpcs --config-set installed_paths "$VENDOR/drupal/coder/coder_sniffer,$VENDOR/sirbrillig/phpcs-variable-analysis,$VENDOR/slevomat/coding-standard"
      - name: List installed standards
        run: phpcs -i
      - name: Run phpcs
        run: phpcs
